name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build web and server bundles
        run: npm run build

      # The host installs production dependencies only. Proving the compiled
      # server boots without tsx/vite/typescript is what keeps a green build
      # from turning into a crash loop after deployment.
      - name: Boot the production server without dev dependencies
        run: |
          rm -rf node_modules
          npm ci --omit=dev
          PORT=3111 DATA_DIR="$RUNNER_TEMP/data" npm start &
          for _ in $(seq 1 20); do
            sleep 1
            if curl -fsS http://127.0.0.1:3111/api/health > /dev/null; then
              echo "Production server is healthy."
              exit 0
            fi
          done
          echo "Production server did not become healthy." >&2
          exit 1
